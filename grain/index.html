<script>function GrainEngineFactory(){
  const TAU=Math.PI*2;
  let yieldTask=()=>new Promise(resolve=>setTimeout(resolve,0));
  // Worker timers may be throttled when the editor is in a background tab.
  if(typeof WorkerGlobalScope!=='undefined'&&self instanceof WorkerGlobalScope&&typeof MessageChannel!=='undefined'){
    const channel=new MessageChannel(),waiting=[];
    channel.port1.onmessage=()=>waiting.shift()?.();
    yieldTask=()=>new Promise(resolve=>{waiting.push(resolve);channel.port2.postMessage(0);});
  }
  const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
  const smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
  function hash(x,y,seed){
    let n=(Math.imul(x,0x5f356495)^Math.imul(y,0x1f123bb5))+seed|0;
    n=Math.imul(n^(n>>>16),0x7feb352d);
    n=Math.imul(n^(n>>>15),0x846ca68b);
    return ((n^(n>>>16))>>>0)/4294967296;
  }
  const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
  const linear=c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4;
  const gamma=c=>c<=.0031308?12.92*c:1.055*Math.max(0,c)**(1/2.4)-.055;
  const gammaTable=Float64Array.from({length:8193},(_,i)=>gamma(i/8192));
  function fastGamma(c){if(c<0||c>1)return gamma(c);const x=c*8192,i=Math.floor(x),f=x-i;return gammaTable[i]*(1-f)+gammaTable[Math.min(8192,i+1)]*f;}
  function toLab(rgb){
    const [r,g,b]=rgb.map(linear);
    const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b);
    const m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b);
    const s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
    return [.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s];
  }
  function fromLab(L,a,b){
    const l=(L+.3963377774*a+.2158037573*b)**3;
    const m=(L-.1055613458*a-.0638541728*b)**3;
    const s=(L-.0894841775*a-1.291485548*b)**3;
    return [fastGamma(4.0767416621*l-3.3077115913*m+.2309699292*s),fastGamma(-1.2684380046*l+2.6097574011*m-.3413193965*s),fastGamma(-.0041960863*l-.7034186147*m+1.707614701*s)];
  }
  const convert=(color,space)=>space==='oklab'?toLab(hex(color)):space==='linear'?hex(color).map(linear):hex(color);
  function position(point,state,time=0){
    const m=point.motion||{},path=m.path&&m.path!=='inherit'?m.path:(state.motion.path||'orbit');
    if(point.locked||point.boundary||path==='none')return {x:point.x,y:point.y};
    let t=((time/state.motion.duration)%1+1)%1;
    if(path==='keyframes'&&m.keyframes?.length){
      t=(t*(m.cycles||1)+(m.phase||0))%1;
      const keys=m.keyframes.slice().sort((a,b)=>a.t-b.t);let a=keys[keys.length-1],b=keys[0],at=a.t,bt=b.t+1,q=t;
      for(let i=0;i<keys.length-1;i++)if(t>=keys[i].t&&t<keys[i+1].t){a=keys[i];b=keys[i+1];at=a.t;bt=b.t;break;}
      if(q<at)q++;let f=bt===at?0:(q-at)/(bt-at);if(state.motion.easing==='smooth')f=smooth(f);
      return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};
    }
    if(!time||!state.motion.amount)return {x:point.x,y:point.y};
    if(state.motion.easing==='smooth')t=smooth(t);
    const phase=hash(point.id,13,state.seed)*TAU+(m.phase||0)*TAU;
    const angle=TAU*t*(m.cycles||1);
    const amplitude=state.motion.amount*(m.amount??1);
    let x=point.x+(path==='vertical'?0:amplitude*(Math.sin(angle+phase)-Math.sin(phase)));
    let y=point.y+(path==='horizontal'?0:amplitude*(Math.cos((path==='figure8'?2:1)*angle+phase)-Math.cos(phase)));
    if(state.tileable){x=(x%1+1)%1;y=(y%1+1)%1;}
    return {x,y};
  }
  function meshTriangles(state,time=0,detail=12){
    const mesh=state.mesh,size=mesh.size,nodes=mesh.nodes.map(n=>({...n,...position(n,state,time),rgb:convert(n.color,state.blend)}));
    if(state.tileable)for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(r===size-1||c===size-1){const p=nodes[r*size+c],source=nodes[(r%(size-1))*size+c%(size-1)];p.rgb=source.rgb;for(const key of ['hx','hy','vx','vy'])p[key]=source[key];}
    const H=t=>[2*t*t*t-3*t*t+1,t*t*t-2*t*t+t,-2*t*t*t+3*t*t,t*t*t-t*t];
    const triangles=[];
    for(let row=0;row<size-1;row++)for(let col=0;col<size-1;col++){
      const p=[nodes[row*size+col],nodes[row*size+col+1],nodes[(row+1)*size+col],nodes[(row+1)*size+col+1]],verts=[];
      for(let j=0;j<=detail;j++)for(let i=0;i<=detail;i++){
        const u=i/detail,v=j/detail,a=H(u),b=H(v),vertex={rgb:[0,0,0]};
        for(const key of ['x','y']){
          const du=key==='x'?'hx':'hy',dv=key==='x'?'vx':'vy';
          const top=a[0]*p[0][key]+a[1]*p[0][du]+a[2]*p[1][key]+a[3]*p[1][du];
          const bottom=a[0]*p[2][key]+a[1]*p[2][du]+a[2]*p[3][key]+a[3]*p[3][du];
          vertex[key]=b[0]*top+b[2]*bottom+b[1]*(a[0]*p[0][dv]+a[2]*p[1][dv])+b[3]*(a[0]*p[2][dv]+a[2]*p[3][dv]);
        }
        for(let k=0;k<3;k++)vertex.rgb[k]=p[0].rgb[k]*(1-u)*(1-v)+p[1].rgb[k]*u*(1-v)+p[2].rgb[k]*(1-u)*v+p[3].rgb[k]*u*v;
        verts.push(vertex);
      }
      for(let j=0;j<detail;j++)for(let i=0;i<detail;i++){const n=j*(detail+1)+i;triangles.push([verts[n],verts[n+1],verts[n+detail+2]],[verts[n],verts[n+detail+2],verts[n+detail+1]]);}
    }
    return triangles;
  }
  function makeField(doc,state,w,h,time){
    if(doc.renderer==='texture'){
      const textureState={...state,...doc,output:state.output,tileable:state.tileable},tint=hex(doc.tint||'#ffffff');
      return {beginRow(){},sample(x,y,target){const n=noiseAt((x+.5)/w,(y+.5)/h,textureState,w,h)*doc.grain.amount*1.55;for(let k=0;k<3;k++)target[k]=clamp((.5+n)*tint[k]);}};
    }
    const space=doc.blend,bg=convert(doc.background,space),ratio=state.output.width/state.output.height,sx=Math.max(1,ratio),sy=Math.max(1,1/ratio);
    let meshRow,bins;
    const points=doc.renderer==='mesh'?[]:doc.points.map(p=>{
      const pos=position(p,state,time),dx=new Float64Array(w),dy=new Float64Array(h);
      for(let x=0;x<w;x++){let d=Math.abs((x+.5)/w-pos.x);if(state.tileable){d%=1;d=Math.min(d,1-d);}dx[x]=(d*sx/p.aspect)**2;}
      for(let y=0;y<h;y++){let d=Math.abs((y+.5)/h-pos.y);if(state.tileable){d%=1;d=Math.min(d,1-d);}dy[y]=(d*sy)**2;}
      return {...p,rgb:convert(p.color,space),dx,dy,radiusSquared:p.radius*p.radius,invRadius:1/p.radius};
    });
    if(doc.renderer==='mesh'){
      meshRow=new Float64Array(w*3);bins=Array.from({length:h},()=>[]);
      for(const vertices of meshTriangles({...state,...doc},time,Math.max(w,h)>400?16:8)){
        const [a,b,c]=vertices,den=(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);if(Math.abs(den)<1e-12)continue;
        const coeff=[0,1,2].map(k=>{const dx=((b.rgb[k]-a.rgb[k])*(c.y-a.y)-(c.rgb[k]-a.rgb[k])*(b.y-a.y))/den,dy=((c.rgb[k]-a.rgb[k])*(b.x-a.x)-(b.rgb[k]-a.rgb[k])*(c.x-a.x))/den;return [dx,dy,a.rgb[k]-dx*a.x-dy*a.y];});
        const triangle={vertices,coeff};
        for(let y=Math.max(0,Math.ceil(Math.min(a.y,b.y,c.y)*h-.5));y<=Math.min(h-1,Math.floor(Math.max(a.y,b.y,c.y)*h-.5));y++)bins[y].push(triangle);
      }
    }
    function beginRow(y){
      if(!meshRow)return;
      for(let x=0;x<w;x++)for(let k=0;k<3;k++)meshRow[x*3+k]=bg[k];
      const v=(y+.5)/h;
      for(const triangle of bins[y]){
        const intersections=[],vs=triangle.vertices;
        for(let i=0;i<3;i++){const a=vs[i],b=vs[(i+1)%3];if((v>=a.y&&v<b.y)||(v>=b.y&&v<a.y))intersections.push(a.x+(v-a.y)*(b.x-a.x)/(b.y-a.y));}
        if(intersections.length<2)continue;
        const start=Math.max(0,Math.ceil(Math.min(...intersections)*w-.5)),end=Math.min(w-1,Math.floor(Math.max(...intersections)*w-.5));
        for(let x=start;x<=end;x++){const u=(x+.5)/w;for(let k=0;k<3;k++){const q=triangle.coeff[k];meshRow[x*3+k]=q[0]*u+q[1]*v+q[2];}}
      }
    }
    function sample(x,y,target){
      let r=meshRow?meshRow[x*3]:bg[0],g=meshRow?meshRow[x*3+1]:bg[1],b=meshRow?meshRow[x*3+2]:bg[2];
      for(const p of points){const squared=p.dx[x]+p.dy[y];if(squared>=p.radiusSquared)continue;const t=1-Math.sqrt(squared)*p.invRadius,a=t*t*(3-2*t)*p.opacity;r+=(p.rgb[0]-r)*a;g+=(p.rgb[1]-g)*a;b+=(p.rgb[2]-b)*a;}
      if(space==='oklab')[r,g,b]=fromLab(r,g,b);else if(space==='linear'){r=fastGamma(r);g=fastGamma(g);b=fastGamma(b);}
      target[0]=r;target[1]=g;target[2]=b;
    }
    return {beginRow,sample};
  }
  function composite(base,top,mode,opacity){
    const mixed=mode==='screen'?1-(1-base)*(1-top):mode==='multiply'?base*top:mode==='overlay'?(base<.5?2*base*top:1-2*(1-base)*(1-top)):top;
    return base+(mixed-base)*opacity;
  }
  function noiseAt(u,v,state,w,h){
    const g=state.grain;
    const base=g.scale==='pixels'?Math.min(state.output.width,state.output.height):800;
    const ratio=state.output.width/state.output.height;
    const special=['paper','directional','organic'].includes(g.type),scale=special?g.size*12:g.size;
    const nx=Math.max(1,Math.round(base*Math.max(1,ratio)/scale*(g.type==='directional'?5:1)));
    const ny=Math.max(1,Math.round(base*Math.max(1,1/ratio)/scale*(g.type==='directional'?.3:1)));
    const qx=u*nx,qy=v*ny;
    const ix=Math.floor(qx),iy=Math.floor(qy);
    const sample=(x,y,s=state.seed)=>hash(state.tileable?(x%nx+nx)%nx:x,state.tileable?(y%ny+ny)%ny:y,s);
    if(g.type==='soft'||special){
      const fx=smooth(qx-ix),fy=smooth(qy-iy);
      const a=sample(ix,iy)*(1-fx)+sample(ix+1,iy)*fx;
      const b=sample(ix,iy+1)*(1-fx)+sample(ix+1,iy+1)*fx;
      const value=a*(1-fy)+b*fy;
      if(g.type==='paper')return (value-.5)*.9+(sample(ix*3,iy*3,state.seed+39)-.5)*.18;
      if(g.type==='organic')return (Math.abs(value-.5)*2-.35)*1.4;
      return (value-.5)*1.8;
    }
    if(g.type==='gaussian'){
      const a=Math.max(1e-9,sample(ix,iy));
      return clamp(Math.sqrt(-2*Math.log(a))*Math.cos(TAU*sample(ix,iy,state.seed+177)), -3,3)/6;
    }
    return sample(ix,iy)-.5;
  }
  let cachedNoise=null;
  function noiseTables(state,w,h){
    if(['paper','directional','organic'].includes(state.grain.type))return null;
    const g=state.grain,base=g.scale==='pixels'?Math.min(state.output.width,state.output.height):800,ratio=state.output.width/state.output.height;
    const nx=Math.max(1,Math.round(base*Math.max(1,ratio)/g.size)),ny=Math.max(1,Math.round(base*Math.max(1,1/ratio)/g.size));
    if((nx+1)*(ny+1)>1500000||(nx+1)*(ny+1)>Math.max(4096,w*h*2))return null;
    const key=[state.seed,g.type,nx,ny,state.tileable].join(':');
    if(cachedNoise?.key===key)return cachedNoise;
    const seeds=g.type==='colored'?[state.seed,state.seed+97,state.seed+193]:[state.seed];
    const stride=nx+1;
    const tables=seeds.map(seed=>{
      const values=new Float64Array(stride*(ny+1));
      for(let y=0;y<=ny;y++)for(let x=0;x<=nx;x++){
        const cx=state.tileable?x%nx:x,cy=state.tileable?y%ny:y;
        const a=hash(cx,cy,seed);
        values[y*stride+x]=g.type==='gaussian'?clamp(Math.sqrt(-2*Math.log(Math.max(1e-9,a)))*Math.cos(TAU*hash(cx,cy,seed+177)),-3,3)/6:a-.5;
      }
      return values;
    });
    return cachedNoise={key,nx,ny,stride,tables};
  }
  function prepare(state,w,h,time){
    const baseField=makeField(state,state,w,h,time),baseSample=new Float64Array(3),layerSample=new Float64Array(3);
    const fields=(state.layers||[]).filter(l=>l.visible&&l.opacity>0).map(layer=>({layer,field:makeField(layer,state,w,h,time)}));
    const pixels=new Uint8ClampedArray(w*h*4);
    const grainAmount=state.grain.amount*1.55;
    const greenNoise={...state,seed:state.seed+97},blueNoise={...state,seed:state.seed+193};
    const table=grainAmount?noiseTables(state,w,h):null;
    let cellX,cellY,fractionX,fractionY;
    if(table){
      cellX=new Int32Array(w);cellY=new Int32Array(h);fractionX=new Float64Array(w);fractionY=new Float64Array(h);
      for(let x=0;x<w;x++){const q=(x+.5)/w*table.nx;cellX[x]=Math.floor(q);fractionX[x]=smooth(q-cellX[x]);}
      for(let y=0;y<h;y++){const q=(y+.5)/h*table.ny;cellY[y]=Math.floor(q);fractionY[y]=smooth(q-cellY[y]);}
    }
    function rows(start,end){
      for(let y=start;y<end;y++){
        const v=(y+.5)/h;
        baseField.beginRow(y);for(const entry of fields)entry.field.beginRow(y);
        for(let x=0;x<w;x++){
          const u=(x+.5)/w;
          baseField.sample(x,y,baseSample);let [r,g,b]=baseSample;
          for(const entry of fields){entry.field.sample(x,y,layerSample);const l=entry.layer;r=composite(r,layerSample[0],l.mix,l.opacity);g=composite(g,layerSample[1],l.mix,l.opacity);b=composite(b,layerSample[2],l.mix,l.opacity);}
          const luma=.2126*r+.7152*g+.0722*b;
          const f=state.effects;
          const vignette=state.tileable||!f.vignette?1:1-f.vignette*smooth(Math.hypot(u-.5,v-.5)/.71);
          r=((luma+(r-luma)*f.saturation-.5)*f.contrast+.5+f.brightness)*vignette;
          g=((luma+(g-luma)*f.saturation-.5)*f.contrast+.5+f.brightness)*vignette;
          b=((luma+(b-luma)*f.saturation-.5)*f.contrast+.5+f.brightness)*vignette;
          if(grainAmount){
            const mask=1-state.grain.shadows*(1-4*clamp(luma)*(1-clamp(luma)));
            let noise,index;
            if(table){
              index=cellY[y]*table.stride+cellX[x];noise=table.tables[0][index];
              if(state.grain.type==='soft'){const fx=fractionX[x],fy=fractionY[y],values=table.tables[0];noise=((noise*(1-fx)+values[index+1]*fx)*(1-fy)+(values[index+table.stride]*(1-fx)+values[index+table.stride+1]*fx)*fy)*1.8;}
            }else noise=noiseAt(u,v,state,w,h);
            const n=noise*grainAmount*mask;
            r+=n;g+=n;b+=n;
            if(state.grain.type==='colored'){
              g+=(table?table.tables[1][index]:noiseAt(u,v,greenNoise,w,h))*grainAmount*.45*mask;
              b+=(table?table.tables[2][index]:noiseAt(u,v,blueNoise,w,h))*grainAmount*.45*mask;
            }
          }
          const i=(y*w+x)*4;
          pixels[i]=clamp(r)*255;pixels[i+1]=clamp(g)*255;pixels[i+2]=clamp(b)*255;pixels[i+3]=255;
        }
      }
    }

function vectorSVG(snapshot){

  if(event.key==='ArrowLeft'||event.key==='ArrowRight')x+=event.key==='ArrowLeft'?-step:step;else y+=event.key==='ArrowUp'?-step:step;
  features.movePoint(p,Math.round(Math.max(0,Math.min(1,x))*1000)/1000,Math.round(Math.max(0,Math.min(1,y))*1000)/1000);
  edited(true);syncFields('point.x');syncFields('point.y');
});
$('handles').addEventListener('keyup',event=>{if(event.key.startsWith('Arrow')){commit();if(tab==='motion')renderPanel();requestPreview();}});
document.addEventListener('keydown',event=>{
  const editing=event.target.closest('input,select,textarea,[contenteditable=true]');if(editing||document.querySelector('dialog[open]'))return;
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();(event.shiftKey?$('redo'):$('undo')).click();return;}
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();saveProject();return;}
  if(event.ctrlKey||event.metaKey||event.altKey)return;
  if(event.code==='Space'&&event.target.tagName!=='BUTTON'){event.preventDefault();togglePlay();}
  else if(event.key.toLowerCase()==='r')randomize('all');
  else if(event.key.toLowerCase()==='h')$('handlesToggle').click();
  else if(event.key==='Escape'&&exportBusy)cancelExport();
});
new ResizeObserver(()=>{fitBoard();requestPreview();}).observe(stage);
new ResizeObserver(()=>paginatePanel()).observe($('panel'));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stopPlay();requestPreview();if(tab==='motion')renderPanel();}});
window.addEventListener('pagehide',()=>{previewRenderer.destroy();exportRenderer.destroy();features?.destroy();if(activeRecorder?.state==='recording')activeRecorder.stop();try{localStorage.setItem(STORAGE,JSON.stringify(exportSnapshot()));}catch{}});
features=GrainFeaturesFactory({state:()=>state,point:currentPoint,tab:()=>tab,isRendering:()=>renderingPanel,time:()=>renderTime,playing:()=>playing,snapshot:exportSnapshot,libraryContext:()=>({favorites,mode:libraryMode}),select:id=>selected=id,L,esc,field,colorField,selectField,renderPanel,renderHandles,commit,edited,toast,showCode,replace:replaceState,requestPreview,fitBoard,resetLibraryPage:()=>libraryPage=0,setRepeat:value=>{repeat=value;updateChrome();},setTime:time=>{stopPlay();timelineTime=time;renderTime=time;state.motion.playhead=time;persist();requestPreview();}});
translate();fitBoard();requestPreview();
if(shareError)toast(L('Paylaşım bağlantısı geçersiz; kayıtlı tasarım açıldı.','Invalid share link; opened your saved design.'),true);
if(!storageAvailable)$('saveStatus').textContent=L('Tarayıcı kaydı kapalı · JSON kaydedebilirsin','Browser storage unavailable · save JSON');
})();
